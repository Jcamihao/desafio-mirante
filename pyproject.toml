[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirante"]

[project]
name = "mirante-sql-modernizer"
version = "0.1.0"
description = "Pipeline hibrido (LLM + regras) de modernizacao PL/pgSQL -> Python 3.14"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=0.6",
    "langgraph-cli[inmem]>=0.4",
    "langchain-anthropic",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.2",
    "fastapi",
    "pydantic>=2",
    "pydantic-settings",
    "langfuse>=3",
    "pglast>=8.4",
    "langchain-google-genai>=4.4.0",
    "ruff>=0.16.9",
    "langchain>=1.4.3",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "httpx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: precisa de um PostgreSQL acessivel (pulado se ausente)"]

[tool.ruff]
line-length = 100
# results/ guarda o codigo GERADO pelo pipeline: e validado pela camada de validacao, nao pelo estilo do projeto
extend-exclude = ["results"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
